name: Format Checker

on:
  pull_request:
    branches:
      - dev
  push:

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v2

    - name: Set up Python
      uses: actions/setup-python@v2
      with:
        python-version: 3.11

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install black==24.4.0

    - name: Run Black Check
      run: |
        black --check .